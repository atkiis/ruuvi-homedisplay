# ─────────────────────────────────────────────────────────────────────────────
# ESPHome configuration for the Seeed reTerminal E1001 (7.5" 800x480 mono e-ink)
# acting as a thin client for the ruuvi-homedisplay server.
#
# How it works:
#   The reTerminal E1001 is an ESP32-S3 e-paper device and cannot run a browser.
#   This config makes it periodically download the pre-rendered dashboard image
#   from the Flask server (the /epaper.png endpoint) and draw it on the panel.
#   Between refreshes the board sleeps to save battery — e-ink keeps the last
#   image on screen with zero power.
#
# Before flashing:
#   1. Add the official Seeed reTerminal E1001 base package below. Seeed ships an
#      ESPHome example that defines the e-paper `display:` platform and the exact
#      ESP32-S3 pin mapping for this board — see the "reTerminal E Series ESPHome"
#      guide on wiki.seeedstudio.com and copy its `esp32:`, `spi:` and `display:`
#      blocks (or include it as a remote `packages:` entry). Those board specifics
#      are intentionally NOT guessed here.
#   2. Set your WiFi credentials and the server URL in the `substitutions:` block.
#   3. flash with:  esphome run ruuvi-homedisplay-e1001.yaml
# ─────────────────────────────────────────────────────────────────────────────

substitutions:
  device_name: ruuvi-homedisplay
  # Base URL of the machine running app.py (no trailing slash).
  server_base_url: "http://192.168.1.150:5001"
  # How often to refresh the image.
  refresh_interval: "1min"
  # ── Battery / deep-sleep tuning ──────────────────────────────────────────
  # How long to stay awake per cycle.  Must be long enough for WiFi connect
  # (~3 s) + image download + panel redraw (~5–15 s).
  # 40 s is safe; lower to ~25 s once you're confident in your WiFi speed.
  run_duration: "25s"
  # Must match refresh_interval minus run_duration (so total cycle = interval).
  sleep_duration: "35s"

esphome:
  name: ${device_name}
  on_boot:
    - priority: 600   # very early boot: enable battery measurement circuit
      then:
        - output.turn_on: battery_measure_enable
    - priority: -100   # runs after WiFi is connected
      then:
        - script.execute: refresh_image

esp32:
  variant: esp32s3
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

spi:
  clk_pin: GPIO7
  mosi_pin: GPIO9

logger:
api:
ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true    # skip full scan, use saved BSSID/channel from RTC → ~1-3 s faster per wake
  power_save_mode: none # no throttling during the brief active window

time:
  - platform: sntp   # or `sntp` if not using Home Assistant
    id: esp_time

# Required by online_image downloads.
http_request:
  id: http_client
  useragent: esphome/ruuvi-homedisplay
  timeout: 10s

# E1001 battery monitor needs GPIO21 enabled, then voltage is read from GPIO1.
output:
  - platform: gpio
    pin: GPIO21
    id: battery_measure_enable

sensor:
  - platform: adc
    pin: GPIO1
    id: battery_voltage
    name: "Battery Voltage"
    attenuation: 12db
    update_interval: 10s
    filters:
      - multiply: 2.0  # voltage divider compensation

  - platform: template
    id: battery_level
    name: "Battery Level"
    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement
    icon: mdi:battery
    lambda: 'return id(battery_voltage).state;'
    update_interval: 10s
    filters:
      - calibrate_linear:
          - 4.15 -> 100.0
          - 3.96 -> 90.0
          - 3.91 -> 80.0
          - 3.85 -> 70.0
          - 3.80 -> 60.0
          - 3.75 -> 50.0
          - 3.68 -> 40.0
          - 3.58 -> 30.0
          - 3.49 -> 20.0
          - 3.41 -> 10.0
          - 3.30 -> 5.0
          - 3.27 -> 0.0
      - clamp:
          min_value: 0
          max_value: 100

font:
  - file: "gfonts://Roboto"
    size: 20
    id: battery_font

# Download the dashboard image rendered by the Flask server.
online_image:
  - id: dashboard_image
    url: "${server_base_url}/epaper.png"
    http_request_id: http_client
    format: PNG
    type: BINARY            # 1-bit; use RGB565 instead for the colour E1002
    update_interval: never  # we trigger the download manually below
    on_download_finished:
      - component.update: epaper        # blocks until e-ink panel finishes refreshing
      - deep_sleep.enter:
          id: deep_sleep_1

display:
  - platform: waveshare_epaper
    id: epaper
    model: 7.50inv2
    cs_pin: GPIO10
    dc_pin: GPIO11
    reset_pin:
      number: GPIO12
      inverted: false
    busy_pin:
      number: GPIO13
      inverted: true
    update_interval: never
    lambda: |-
      it.image(0, 0, id(dashboard_image));

      // Battery badge overlay (top-right): use mono-safe COLOR_ON/COLOR_OFF.
      const int box_w = 116;
      const int box_h = 36;
      const int box_x = 800 - box_w - 12;
      const int box_y = 70;
      it.filled_rectangle(box_x, box_y, box_w, box_h, COLOR_OFF);
      it.rectangle(box_x, box_y, box_w, box_h, COLOR_ON);

      // Battery body + nub
      const int body_x = box_x + 8;
      const int body_y = box_y + 8;
      const int body_w = 26;
      const int body_h = 20;
      it.rectangle(body_x, body_y, body_w, body_h, COLOR_ON);
      it.filled_rectangle(body_x + body_w, body_y + 6, 3, 8, COLOR_ON);

      if (!isnan(id(battery_level).state)) {
        int pct = (int) (id(battery_level).state + 0.5f);
        if (pct < 0) pct = 0;
        if (pct > 100) pct = 100;

        const int fill_w = (pct * (body_w - 4)) / 100;
        if (fill_w > 0) {
          it.filled_rectangle(body_x + 2, body_y + 2, fill_w, body_h - 4, COLOR_ON);
        }

        it.printf(box_x + 42, box_y + 10, id(battery_font), COLOR_ON, "%d%%", pct);
      } else {
        it.printf(box_x + 42, box_y + 10, id(battery_font), COLOR_ON, "--%%");
      }

# ── Core refresh logic ────────────────────────────────────────────────────────
# Keep this intentionally simple: download /epaper.png and refresh once per wake.
script:
  - id: refresh_image
    mode: single            # ignore new triggers while already running
    then:
      - http_request.get:
          url: !lambda |-
            char url[220];
            const float lvl = id(battery_level).state;
            const float vol = id(battery_voltage).state;
            if (!isnan(lvl) && !isnan(vol)) {
              snprintf(url, sizeof(url), "${server_base_url}/api/device/battery?level=%.1f&voltage=%.3f", lvl, vol);
            } else if (!isnan(lvl)) {
              snprintf(url, sizeof(url), "${server_base_url}/api/device/battery?level=%.1f", lvl);
            } else if (!isnan(vol)) {
              snprintf(url, sizeof(url), "${server_base_url}/api/device/battery?voltage=%.3f", vol);
            } else {
              snprintf(url, sizeof(url), "${server_base_url}/api/device/battery");
            }
            return std::string(url);
      - component.update: dashboard_image

# ── USB-powered mode: run the check on a fixed interval ──────────────────────
# Uncomment the interval block below (and comment out deep_sleep + on_boot)
# to switch to always-on USB-powered mode.
#
# interval:
#   - interval: ${refresh_interval}
#     then:
#       - script.execute: refresh_image

# ── Battery-powered mode: deep sleep between refreshes ───────────────────────
# When enabled the device wakes, runs the check, then sleeps for sleep_duration.
# The on_boot action replaces the interval above (the interval never fires
# during a 40 s wake window).
#
# IMPORTANT: deep sleep breaks OTA updates. To flash new firmware, either
#   a) hold the BOOT button while powering on to prevent deep sleep, or
#   b) temporarily increase run_duration well beyond refresh_interval.
#
# To disable deep sleep (USB-powered mode): comment out the deep_sleep block
# below AND the on_boot block in esphome:, then uncomment the interval block.

deep_sleep:
  id: deep_sleep_1
  run_duration: ${run_duration}    # safety timeout – device sleeps early once work is done
  sleep_duration: ${sleep_duration}
