# ─────────────────────────────────────────────────────────────────────────────
# ESPHome configuration for the Seeed reTerminal E1002 (7.5" 800x480 colour e-ink)
# acting as a thin client for the ruuvi-homedisplay server.
#
# How it works:
#   The reTerminal E1002 is an ESP32-S3 e-paper device and cannot run a browser.
#   This config makes it periodically download the colour dashboard image from
#   the Flask server (the /epaper-e1002.png endpoint) and draw it on the panel.
#   Between refreshes the board sleeps to save power — e-ink keeps the last
#   image on screen with zero power.
#
# Before flashing:
#   1. Add the official Seeed reTerminal E1002 base package below. Seeed ships
#      an ESPHome example that defines the e-paper `display:` platform and the
#      exact ESP32-S3 pin mapping for this board — see the "reTerminal E Series
#      ESPHome" guide on wiki.seeedstudio.com and copy its `esp32:`, `spi:` and
#      `display:` blocks (or include it as a remote `packages:` entry). Those
#      board specifics are intentionally NOT guessed here.
#   2. Set your WiFi credentials and the server URL in the `substitutions:` block.
#   3. flash with:  esphome run ruuvi-homedisplay-e1002.yaml
# ─────────────────────────────────────────────────────────────────────────────

substitutions:
  device_name: ruuvi-homedisplay-e1002
  # Base URL of the machine running app.py (no trailing slash).
  server_base_url: "http://192.168.1.150:5001"
  # How often to wake, re-download the image and refresh the panel.
  # The layout is intended to update once an hour.
  refresh_interval: "1h"
  # ── Battery / deep-sleep tuning ──────────────────────────────────────────
  # How long to stay awake per cycle. Must be long enough for WiFi connect
  # (~3 s) + image download + panel redraw.
  run_duration: "50s"
  # Must match refresh_interval minus run_duration (so total cycle = interval).
  sleep_duration: "59m10s"

esphome:
  name: ${device_name}
  on_boot:
    - priority: 600
      then:
        - output.turn_on: battery_measure_enable
    - priority: -100
      then:
        - delay: 6s
        - logger.log:
            level: DEBUG
            format: "Battery: voltage=%.3fV  level=%.1f%%"
            args: [id(battery_voltage).state, id(battery_level).state]
        - output.turn_off: battery_measure_enable
        - script.execute: refresh_image

esp32:
  variant: esp32s3
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

spi:
  clk_pin: GPIO7
  mosi_pin: GPIO9

logger:
  level: DEBUG

api:
  reboot_timeout: 0s

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  power_save_mode: none

# Required by online_image downloads.
http_request:
  id: http_client
  useragent: esphome/ruuvi-homedisplay-e1002
  timeout: 10s

# E1002 battery monitor needs GPIO21 enabled, then voltage is read from GPIO1.
output:
  - platform: gpio
    pin: GPIO21
    id: battery_measure_enable

sensor:
  - platform: adc
    pin: GPIO1
    id: battery_voltage
    name: "Battery Voltage"
    attenuation: 12db
    update_interval: 5s
    filters:
      - multiply: 2.0

  - platform: template
    id: battery_level
    name: "Battery Level"
    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement
    icon: mdi:battery
    lambda: 'return id(battery_voltage).state;'
    update_interval: 5s
    filters:
      - calibrate_linear:
          - 4.15 -> 100.0
          - 3.96 -> 90.0
          - 3.91 -> 80.0
          - 3.85 -> 70.0
          - 3.80 -> 60.0
          - 3.75 -> 50.0
          - 3.68 -> 40.0
          - 3.58 -> 30.0
          - 3.49 -> 20.0
          - 3.41 -> 10.0
          - 3.30 -> 5.0
          - 3.27 -> 0.0
      - clamp:
          min_value: 0
          max_value: 100

font:
  - file: "gfonts://Roboto"
    size: 20
    id: battery_font

# Download the colour dashboard image rendered by the Flask server.
online_image:
  - id: dashboard_image
    url: "${server_base_url}/epaper-e1002.png"
    http_request_id: http_client
    format: PNG
    type: RGB565
    update_interval: never
    on_download_finished:
      - component.update: epaper
      - deep_sleep.enter:
          id: deep_sleep_1

# The actual `display:` block must come from Seeed's board package. The lambda
# should simply blit the downloaded image at 0,0.
#
# display:
#   - platform: <seeed reterminal e-paper platform>
#     id: epaper
#     update_interval: never
#     lambda: |-
#       it.image(0, 0, id(dashboard_image));

# ── Core refresh logic ────────────────────────────────────────────────────────
script:
  - id: refresh_image
    mode: single
    then:
      - http_request.get:
          url: !lambda |-
            if (!isnan(id(battery_voltage).state) && !isnan(id(battery_level).state)) {
              return str_sprintf("${server_base_url}/api/device/battery?level=%.1f&voltage=%.3f",
                                 id(battery_level).state, id(battery_voltage).state);
            }
            return std::string("${server_base_url}/api/device/battery");
      - component.update: dashboard_image

# ── Hourly wake cycle ────────────────────────────────────────────────────────
# Comment out the deep_sleep block below and the on_boot actions above if you
# want USB-powered always-on mode for debugging or OTA updates, then use the
# interval block instead.
#
# interval:
#   - interval: ${refresh_interval}
#     then:
#       - script.execute: refresh_image

# ── Battery-powered mode: deep sleep between refreshes ───────────────────────
deep_sleep:
  id: deep_sleep_1
  run_duration: ${run_duration}
  sleep_duration: ${sleep_duration}
